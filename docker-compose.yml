services:
  app:
    build: .
    container_name: shree-kamal-nayan-backend
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: kamal_nayan
      PG_USER: postgres
      PG_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: shree-kamal-nayan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: shree-kamal-nayan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kamal_nayan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kamal_nayan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
